databases:
  - name: wastewise-db
    plan: free
    region: oregon

services:
  - type: web
    name: wastewise-ng
    env: python
    region: oregon
    plan: free
    pythonVersion: "3.12.7"
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn backend.wsgi:application --workers 1 --threads 2 --timeout 180"
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wastewise-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"
