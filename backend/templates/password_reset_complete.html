{% extends 'base.html' %}
{% block title %}Password Reset Complete | WasteWise NG{% endblock %}

{% block content %}
<main class="page-content" style="min-height:calc(100vh - 160px);display:flex;align-items:center;justify-content:center;padding:40px 16px;">
  <div class="ww-card" style="width:100%;max-width:440px;margin:40px auto;padding:44px 36px;text-align:center;">
    <div style="width:56px;height:56px;border-radius:50%;background:#F0F5E8;border:1.5px solid #C8D5BA;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;color:#1B3A2D;">
      <i data-lucide="check-circle" style="width:28px;height:28px;"></i>
    </div>

    <h2 style="font-size:22px;font-weight:700;color:#1B3A2D;margin-bottom:12px;">Password Reset Complete</h2>
    
    <p style="font-size:15px;color:#4A5E4E;line-height:1.6;margin-bottom:28px;">
      Your password has been successfully reset! You can now sign in with your new password.
    </p>

    <a href="{% url 'login' %}" class="btn-primary" style="width:100%;justify-content:center;padding:12px;">
      Sign in now
    </a>
  </div>
</main>
{% endblock %}
